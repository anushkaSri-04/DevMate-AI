
services:
  devmate-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: devmate-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data/chroma:/app/data/chroma

    restart: unless-stopped

  devmate-frontend:
    build:
      context: ./devmate-frontend
      dockerfile: Dockerfile

    container_name: devmate-frontend

    ports:
      - "5500:80"

    depends_on:
      - devmate-api

    restart: unless-stopped
